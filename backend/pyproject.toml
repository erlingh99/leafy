[project]
name = "leafy-lapse"
version = "0.1.0"
description = "Backend for the Leafy Project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "pydantic>=2.11.9",
    "python-multipart>=0.0.9",
    "tool>=0.8.0",
    "pytest>=8.4.2",
    "sqlalchemy>=2.0.43",
    "alembic>=1.16.5",
    "aiosqlite>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
