services:
  leafy:
    container_name: leafy_backend
    image: ghcr.io/erlingh99/leafy:latest
    platform: linux/arm64
    dns:
      - ${DNS_IP}
    env_file:
      - .env
    networks:
      - proxy
    volumes:
      - leafy_data:/app/data
    restart: unless-stopped
    labels:
      - docker-volume-backup.stop-during-backup=leafy-backup

  leafy-backup:
    image: offen/docker-volume-backup:v2
    container_name: leafy_backup
    platform: linux/arm64
    restart: unless-stopped
    environment:
      BACKUP_CRON_EXPRESSION: "15 3 * * *"
      BACKUP_FILENAME: "leafy-%Y-%m-%dT%H-%M-%S.tar.gz"
      BACKUP_RETENTION_DAYS: "30"
      BACKUP_STOP_DURING_BACKUP_LABEL: "leafy-backup"
    volumes:
      - leafy_data:/backup/leafy_data:ro
      - ${BACKUP_ARCHIVE_ROOT}/leafy:/archive
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  proxy:
    external: true

volumes:
  leafy_data:
