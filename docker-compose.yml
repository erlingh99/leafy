services:
  leafy:
    container_name: leafy_backend
    image: ghcr.io/erlingh99/leafy:latest
    dns:
      - ${DNS_IP}
    env_file:
      - .env
    networks:
      - proxy
    volumes:
      - leafy_data:/app/data
    restart: unless-stopped

networks:
  proxy:
    external: true

volumes:
  leafy_data:
