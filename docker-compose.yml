services:
  leafy:
    container_name: leafy_backend
    dns:
      - ${DNS_IP}
    build:
      dockerfile: Dockerfile
      args:
        BACKEND_HOST: "0.0.0.0"
        BACKEND_PORT: "80"
    env_file:
      - .env
    networks:
      - proxy
    volumes:
      - leafy_data:/app/data
    restart: unless-stopped

networks:
  proxy:
    external: true

volumes:
  leafy_data:
