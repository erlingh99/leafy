services:
  leafy:
    dns:
      - 192.168.0.2
    container_name: leafy_backend
    hostname: leafy
    networks:
      - proxy
    build:
      dockerfile: Dockerfile
      args:
        BACKEND_HOST: "0.0.0.0"
        BACKEND_PORT: "80"
    volumes:
      - ./backend/:/app/backend/
    restart: unless-stopped

networks:
  proxy:
    external: true

