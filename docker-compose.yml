services:
  leafy:
    container_name: leafy_backend
    hostname: leafy
    networks:
      leafy_network:
        ipv4_adress: 192.168.0.5
    build:
      dockerfile: Dockerfile
      args:
        BACKEND_HOST: "0.0.0.0"
        BACKEND_PORT: "80"
    ports:
      - "80:80"
    volumes:
      - ./backend/:/app/backend/
    restart: unless-stopped

networks:
  leafy_network:
    driver: macvlan
    driver_opts:
      parent: eth0
    ipam:
      config:
        - gateway: 192.168.0.1
          subnet: 192.168.0.0/24